[package]
name = "aksar-py"
description = "Python bindings for aksar (Khmer text: normalize, validate, read, check, words, search tokens)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "aksar"
crate-type = ["cdylib"]

[dependencies]
aksar_core = { package = "aksar", path = "../aksar", version = "0.1.0", features = ["std", "read"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
