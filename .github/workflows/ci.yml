name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI first and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

# Only the newest push of a branch or PR needs a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p aksar --no-default-features
      - run: cargo test --locked -p aksar --all-features
      - run: cargo clippy --locked -p aksar-cli --all-targets --features ocr -- -D warnings
      - run: cargo test --locked -p aksar-cli --features ocr
      # What crates.io will build: catches files missing from `include`.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo package --locked -p aksar

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same pinned action as the other jobs; the `toolchain` input picks 1.85.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.85"
      # aksar-ocr, aksar-recog and aksar-bench need 1.94 (rten); everything else promises 1.85.
      - run: cargo check --locked --workspace --exclude aksar-ocr --exclude aksar-recog --exclude aksar-bench
      - run: cargo check --locked -p aksar --no-default-features
      - run: cargo check --locked -p aksar --all-features

  wasm-and-no-std:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "stable"
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: no_std builds
        run: |
          cargo build --locked -p aksar --no-default-features --target wasm32-unknown-unknown
          cargo build --locked -p aksar --no-default-features --features shape,libm --target wasm32-unknown-unknown
          cargo build --locked -p aksar --no-default-features --features dict,search --target wasm32-unknown-unknown
          # A target with no std at all: catches an accidental std import.
          cargo build --locked -p aksar --no-default-features --target thumbv7em-none-eabihf
          cargo build --locked -p aksar --no-default-features --features shape,libm,dict,search --target thumbv7em-none-eabihf
      - name: WASM size budget
        run: ./scripts/check-wasm-size.sh

  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Build a wheel (as users get it) and test the installed package.
      - name: Build and test the Python bindings
        shell: bash
        run: |
          python -m pip install "maturin==1.16.0" "pytest==9.2.0"
          maturin build --locked -m crates/aksar-py/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist aksar
          python -m pytest crates/aksar-py/tests

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories run weekly in audit.yml, so a new advisory does not fail unrelated PRs.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Short smoke run. Non-blocking until the 1-hour runs in fuzz/README.md are clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "nightly"
      - name: Fuzz each target for 60 s
        working-directory: fuzz
        run: |
          cargo install cargo-fuzz --locked
          for t in syllable dict shape image; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -timeout=10
          done
